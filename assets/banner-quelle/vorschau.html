<!doctype html>
<!--
  Quelle fuer assets/vorschau-karten.png (2480 x 1660), aufgebaut wie
  assets/vorschau-karten.png von WoW Charakter: drei Spalten mit den echten
  Karten der Integration, gefuellt mit den erfundenen Daten aus daten.js.
  Ohne die Arsenal-Karte, deren Waffen- und Fahrzeugbilder Spielgrafik sind.
  Rendern: siehe render.js.
-->
<html lang="de"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=block">
<style>
  :root { --rose: #e6a0c4; --sek: #8794a5; --oben: #1b2231; --unten: #171d29; }
  html, body { margin: 0; background: transparent; }
  body { font-family: Inter, system-ui, sans-serif; }
  .rahmen { position: relative; overflow: hidden; box-sizing: border-box; width: 1240px; height: 830px; border-radius: 28px;
    border: 1px solid rgba(255, 255, 255, 0.07);
    background: radial-gradient(70% 60% at 50% 18%, color-mix(in srgb, var(--rose) 9%, transparent) 0%, transparent 70%),
                linear-gradient(180deg, #151b27 0%, #10151d 100%); }
  .spalte { position: absolute; width: 344px; display: grid; gap: 20px; }
  .karte { position: relative; filter: drop-shadow(0 18px 30px rgba(0, 0, 0, 0.5)); }
  .fuss { position: absolute; right: 40px; bottom: 24px; font-size: 15px; letter-spacing: 0.04em; color: var(--sek); }
</style>
<script type="module" src="vorschau.js"></script>
</head><body></body></html>
