# Prueft jeden Push auf main und jeden Pull Request: Code-Stil, Tests,
# hassfest (Pruefung von Home Assistant) und die HACS-Pruefung.
# Tests laufen gegen zwei Home-Assistant-Versionen (seit 0.6.9):
# - die Mindestversion aus hacs.json
#   (pytest-homeassistant-custom-component 0.13.316 = Home Assistant 2026.2.3)
# - eine aktuelle Version
#   (pytest-homeassistant-custom-component 0.13.375 = Home Assistant 2026.10.4,
#   braucht Python 3.14). Beim Anheben auch README, Abschnitt "Teststand".
name: Pruefung

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Ruff und Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Abhaengigkeiten installieren
        run: pip install pytest-homeassistant-custom-component==0.13.316 ruff==0.16.9

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        run: python -m pytest tests -q

  tests-aktuell:
    name: Tests mit aktuellem Home Assistant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Abhaengigkeiten installieren
        run: pip install pytest-homeassistant-custom-component==0.13.375

      - name: Tests
        run: python -m pytest tests -q

  # Actions sind auf Commits gepinnt (seit 0.6.14), Dependabot haelt sie aktuell.
  # hassfest und HACS laden dabei ihr Docker-Image weiter beweglich
  # (ghcr.io/home-assistant/hassfest, ghcr.io/hacs/action:main): Sie sollen
  # gegen die aktuellen Regeln pruefen, laufen nur mit Leserechten und ohne
  # Geheimnisse, und ein auf Digest gepinntes Image koennte Dependabot nicht
  # aktualisieren.
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master am 03.11.2026

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main am 03.11.2026
        with:
          category: integration
