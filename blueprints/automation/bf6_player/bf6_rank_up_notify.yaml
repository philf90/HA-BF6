blueprint:
  name: "BF6: Rang gestiegen → Benachrichtigung"
  description: >-
    Schickt eine Benachrichtigung an die Home-Assistant-App, wenn ein Spieler
    einen höheren Rang erreicht hat: neuer Rang mit Rangname und vorheriger
    Rang. Grundlage ist die Ereignis-Entität „Rang gestiegen“ der Integration
    BF6 Spieler (Profil stündlich, deshalb mit bis zu einer Stunde Verzug).
    Nach einem Neustart oder Neuladen kommt keine Nachricht für ein altes
    Ereignis.
  domain: automation
  source_url: https://github.com/philf90/HA-BF6/blob/main/blueprints/automation/bf6_player/bf6_rank_up_notify.yaml
  author: philf90
  homeassistant:
    min_version: "2026.2.0"
  input:
    rank_event:
      name: Ereignis „Rang gestiegen“
      description: Eine oder mehrere Entitäten „Rang gestiegen“ (je Spieler eine).
      selector:
        entity:
          multiple: true
          filter:
            - integration: bf6_player
              domain: event
    notify_device:
      name: Gerät für die Benachrichtigung
      description: Gerät mit der offiziellen Home-Assistant-App.
      selector:
        device:
          filter:
            - integration: mobile_app

mode: queued
max: 10

triggers:
  - trigger: state
    entity_id: !input rank_event

variables:
  player: >-
    {% set dev = device_id(trigger.entity_id) %}
    {{ (device_attr(dev, 'name_by_user') or device_attr(dev, 'name')) if dev else trigger.to_state.name }}

conditions:
  # Wie bei „Match beendet“: kein Zustand vorher (Start) oder "unavailable"
  # vorher (Neuladen) heißt altes Ereignis.
  - condition: template
    value_template: >-
      {{ trigger.from_state is not none
         and trigger.from_state.state != 'unavailable'
         and trigger.to_state is not none
         and trigger.to_state.state not in ['unavailable', 'unknown']
         and trigger.to_state.attributes.event_type == 'rank_up' }}

actions:
  - alias: Benachrichtigung an die App
    domain: mobile_app
    type: notify
    device_id: !input notify_device
    title: "BF6: {{ player }}"
    message: >-
      {% set a = trigger.to_state.attributes %}
      Rang {{ a.rank }}{{ ' (' ~ a.rank_name ~ ')' if a.rank_name else '' }}
      erreicht, vorher Rang {{ a.previous_rank }}
